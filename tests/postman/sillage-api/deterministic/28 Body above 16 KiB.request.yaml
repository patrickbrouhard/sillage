$kind: http-request
url: "{{baseUrl}}/api/v1/videos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{{oversizedBody}}"
scripts:
  - type: beforeRequest
    code: pm.variables.set("oversizedBody", "{}" + " ".repeat(16385 - 2));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("JSON response", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/json(?:;|$)/i);
      });

      pm.test("HTTP 413", () => pm.response.to.have.status(413));

      pm.test("Error contract", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.all.keys("error");
          pm.expect(body.error).to.have.all.keys("code", "message");
          pm.expect(body.error.code).to.eql("payload_too_large");
          pm.expect(body.error.message).to.be.a("string").and.not.empty;
          pm.expect(pm.response.headers.has("Location")).to.eql(false);
      });
    language: text/javascript
order: 28000
