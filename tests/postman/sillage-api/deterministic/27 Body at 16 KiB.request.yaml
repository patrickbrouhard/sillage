$kind: http-request
url: "{{baseUrl}}/api/v1/videos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{{boundaryBody}}"
scripts:
  - type: beforeRequest
    code: |-
      // Un corps à la limite atteint la validation URL, sans appeler le processus.
      pm.variables.set("boundaryBody", "{}" + " ".repeat(16384 - 2));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("JSON response", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/json(?:;|$)/i);
      });

      pm.test("HTTP 400", () => pm.response.to.have.status(400));

      pm.test("Error contract", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.all.keys("error");
          pm.expect(body.error).to.have.all.keys("code", "message");
          pm.expect(body.error.code).to.eql("bad_request");
          pm.expect(body.error.message).to.be.a("string").and.not.empty;
          pm.expect(pm.response.headers.has("Location")).to.eql(false);
      });
    language: text/javascript
order: 27000
