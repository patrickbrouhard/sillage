$kind: http-request
url: "{{baseUrl}}/api/v1/videos/42/note"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: "{\"content_md\": \"\"}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 404", () => pm.response.to.have.status(404));
      pm.test("JSON response", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/json(?:;|$)/i));
      pm.test("Error contract", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.all.keys("error");
          pm.expect(body.error).to.have.all.keys("code", "message");
          pm.expect(body.error.code).to.eql("video_not_found");
          pm.expect(body.error.message).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 32000
