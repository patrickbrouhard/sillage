$kind: http-request
url: "{{baseUrl}}/api/v1/videos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("JSON response", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.match(/^application\/json(?:;|$)/i);
      });

      pm.test("HTTP 200", () => pm.response.to.have.status(200));

      pm.test("Library contains exactly the created video", () => {
          pm.expect(pm.response.json()).to.deep.eql({
              videos: [JSON.parse(pm.collectionVariables.get("createdVideo"))]
          });
      });
    language: text/javascript
order: 5000
