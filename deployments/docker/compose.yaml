services:
  sillage:
    image: sillage:local
    container_name: "${SILLAGE_CONTAINER_NAME:-sillage}"
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    user: "${SILLAGE_UID:-1000}:${SILLAGE_GID:-1000}"
    ports:
      - "127.0.0.1:${SILLAGE_PORT:-8080}:8080"
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      SILLAGE_MCP_ENABLED: "${SILLAGE_MCP_ENABLED:-true}"
      SILLAGE_PUBLIC_URL: "${SILLAGE_PUBLIC_URL:-http://127.0.0.1:${SILLAGE_PORT:-8080}}"
      SILLAGE_SESSION_LIFETIME: "${SILLAGE_SESSION_LIFETIME:-12h}"
      SILLAGE_SESSION_IDLE_TIMEOUT: "${SILLAGE_SESSION_IDLE_TIMEOUT:-1h}"
      SILLAGE_LOG_LEVEL: "${SILLAGE_LOG_LEVEL:-INFO}"
      SILLAGE_LOG_FORMAT: "${SILLAGE_LOG_FORMAT:-json}"
      SILLAGE_POST_TIMEOUT: "${SILLAGE_POST_TIMEOUT:-60s}"
      SILLAGE_DOWNLOAD_TIMEOUT: "${SILLAGE_DOWNLOAD_TIMEOUT:-6h}"
    volumes:
      - type: bind
        source: "${SILLAGE_DATA_DIR:?Définir le chemin absolu du répertoire de données}"
        target: /app/data
        bind:
          create_host_path: false
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
