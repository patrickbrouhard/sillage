services:
  sillage:
    image: sillage:local
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    user: "${SILLAGE_UID:-1000}:${SILLAGE_GID:-1000}"
    ports:
      - "127.0.0.1:${SILLAGE_PORT:-8080}:8080"
    environment:
      SILLAGE_POST_TIMEOUT: "${SILLAGE_POST_TIMEOUT:-60s}"
    volumes:
      - type: bind
        source: "${SILLAGE_DATA_DIR:?Définir le chemin absolu du répertoire de données}"
        target: /app/data
        bind:
          create_host_path: false
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
