name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Go and Postman deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # Le sélecteur réel travaille sur des métadonnées synthétiques, sans accès à YouTube.
      - name: Install pinned media tools
        run: |
          version=$(sed -n 's/^ARG YTDLP_VERSION=//p' deployments/docker/Dockerfile)
          checksum=$(sed -n 's/^ARG YTDLP_SHA256=//p' deployments/docker/Dockerfile)
          mkdir -p "$RUNNER_TEMP/media-tools"
          curl -fSL --retry 3 "https://github.com/yt-dlp/yt-dlp/releases/download/$version/yt-dlp_linux" -o "$RUNNER_TEMP/media-tools/yt-dlp"
          echo "$checksum  $RUNNER_TEMP/media-tools/yt-dlp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/media-tools/yt-dlp"
          echo "$RUNNER_TEMP/media-tools" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test and build
        run: |
          go test ./...
          go vet ./...
          go build ./...
          go test -race ./internal/logging ./internal/http/... ./internal/asset ./internal/media ./internal/adapter/filesystem ./internal/adapter/ytdlp

      - name: Install Postman CLI
        run: bash tests/postman/install-cli.sh "$RUNNER_TEMP/postman-cli"

      - name: Validate collections v3
        run: |
          "$RUNNER_TEMP/postman-cli/postman" collection lint tests/postman/sillage-api/deterministic --fail-severity warning
          "$RUNNER_TEMP/postman-cli/postman" collection lint tests/postman/sillage-api/youtube --fail-severity warning

      # Seule cette collection s'exécute : ni yt-dlp réel ni accès réseau externe des scénarios.
      - name: Run deterministic scenarios
        run: |
          python3 tests/postman/run.py deterministic \
            --postman "$RUNNER_TEMP/postman-cli/postman" \
            --logs-dir "$RUNNER_TEMP/sillage-api-logs"

      - name: Preserve execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sillage-api-logs
          path: ${{ runner.temp }}/sillage-api-logs/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web production and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend and Chromium
        run: |
          npm --prefix web ci
          cd web
          npx playwright install --with-deps chromium

      - name: Build and test production through Go
        run: make test-web

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sillage-web-tests
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
