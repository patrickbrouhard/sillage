name: Docker distribution

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Annule les anciennes exécutions d'une même PR lors d'un nouveau commit. Les exécutions sur master ne sont jamais annulées.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker:
    name: Docker build and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build from clean sources
        run: docker build --platform linux/amd64 -f deployments/docker/Dockerfile -t sillage:local .

      - name: Verify tools, Compose and persistence without YouTube
        run: python3 tests/docker/smoke.py

      - name: Verify declarative provisioning and secret rotation
        run: python3 tests/docker/declarative.py
